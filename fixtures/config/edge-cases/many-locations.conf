server {
	listen 80;
	server_name example.com;
	root /var/www;

	location / {
		index index.html;
	}

	location /api {
		allowed_methods GET POST;
	}

	location /static {
		autoindex on;
	}

	location /upload {
		allowed_methods POST;
		upload_store /tmp/uploads;
	}

	location ~ \.php$ {
		cgi_path /usr/bin/php-cgi;
	}
}